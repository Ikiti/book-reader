<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Book Reader</title>
  <meta name="description" content="Read PDF books and articles comfortably on phone and PC: reflowed text, your font, progress tracking, notes to Google Keep or Obsidian.">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="modulepreload" href="js/app.js">
</head>
<body data-view="library">
  <div id="app"><p class="boot muted">Loading…</p></div>
  <div class="drop-hint" aria-hidden="true">Drop PDF files to add them to your library</div>
  <noscript>This app needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
